definition:
  statement: A recorded link from every code change to the item that justifies it, for whoever reads this code later, so that a change can always be traced to a reason someone agreed to
  goals:
  - G-4
  - G-3
  zachman:
    what: A commit trailer naming the item, requirement or task; a branch per item; git hooks that check both
    how: commit-msg validates references against the board; pre-commit refuses the default branch and branches that name no item; a Claude Code PreToolUse hook says the same thing before the attempt, with the reference to use
    where: The project's own code repository — the board's data folder is exempt, since kanbanr authors those commits itself
    when: At commit time, on every commit, and at `kanbanr start` when the branch is created
    who: Whoever writes the code — the developer and Claude alike; the checks do not distinguish
    why: Nothing tied a change to the reason it exists, so work could land on the default branch with no reference at all, and a later reader had only `git blame` and guesswork
  requirements:
  - id: R-1
    kind: functional
    text: WHEN a commit message names an item, requirement or task, THE SYSTEM SHALL check that each one exists on the board and reject the commit when it does not.
    tests:
    - name: cli_git_guardrails_in_a_scratch_repo
      kind: e2e
      state: green
      checked_rev: 34ad27ff8923
    - name: scm::tests::references_are_read_at_whatever_level_the_author_wrote
      kind: unit
      state: green
      checked_rev: 34ad27ff8923
  - id: R-2
    kind: functional
    text: IF a commit references nothing, THEN THE SYSTEM SHALL reject it unless the message records a reason with `[no-ref] <why>`.
    tests:
    - name: scm::tests::the_escape_has_to_say_why
      kind: unit
      state: green
      checked_rev: 34ad27ff8923
    - name: cli_git_guardrails_in_a_scratch_repo
      kind: e2e
      state: green
      checked_rev: 34ad27ff8923
  - id: R-3
    kind: functional
    text: WHEN git writes a commit on the author's behalf, THE SYSTEM SHALL let it through without a reference.
    tests:
    - name: scm::tests::commits_git_writes_itself_carry_no_reference
      kind: unit
      state: green
      checked_rev: 34ad27ff8923
  - id: R-4
    kind: functional
    text: WHILE the checked-out branch is the default branch or names no item, THE SYSTEM SHALL refuse the commit and name the command that puts the work on the right branch.
    tests:
    - name: cli_git_guardrails_in_a_scratch_repo
      kind: e2e
      state: green
      checked_rev: 34ad27ff8923
  - id: R-5
    kind: functional
    text: WHEN `kanbanr start` is run for an item, THE SYSTEM SHALL create or switch to that item's branch from the default branch and move the item into an active status.
    tests:
    - name: scm::tests::branch_names_round_trip_to_the_item_they_belong_to
      kind: unit
      state: green
      checked_rev: 34ad27ff8923
    - name: cli_git_guardrails_in_a_scratch_repo
      kind: e2e
      state: green
      checked_rev: 34ad27ff8923
  - id: R-6
    kind: functional
    text: WHERE a branch is a spike, THE SYSTEM SHALL allow commits on it and refuse to finish it.
    tests:
    - name: cli_git_guardrails_in_a_scratch_repo
      kind: e2e
      state: green
      checked_rev: 34ad27ff8923
  - id: R-7
    kind: functional
    text: WHEN a Bash command is about to run a git commit that would be rejected, THE SYSTEM SHALL deny it beforehand and state the reference to use.
    tests:
    - name: tests::the_commit_guard_recognizes_a_commit_and_reads_its_message
      kind: unit
      state: green
      checked_rev: 34ad27ff8923
  - id: R-8
    kind: nfr
    text: THE SYSTEM SHALL preserve any git hook a repository already has when it installs its own.
    iso25010:
    - Compatibility
    scenario:
      stimulus: Hooks are installed in a repo that already has its own pre-commit hook
      environment: A scratch repository with an executable pre-commit script
      response: Installation refuses, and with --force moves the existing hook aside and runs it first; uninstalling puts it back
      measure: scm::tests::hooks_install_without_clobbering_what_was_there asserts the original content survives install, force-install and uninstall
    tests:
    - name: scm::tests::hooks_install_without_clobbering_what_was_there
      kind: unit
      state: green
      checked_rev: 34ad27ff8923
  - id: R-9
    kind: nfr
    text: IF the kanbanr CLI is not on PATH, THEN THE SYSTEM SHALL let the commit proceed rather than blocking it.
    iso25010:
    - Reliability
    scenario:
      stimulus: A commit is made in a repo with the hooks installed but no kanbanr binary available
      environment: Any checkout of the repo, e.g. a contributor's machine or CI
      response: The hook exits 0 without a check, so the repo is never unusable because of a missing tool
      measure: scm::tests::hooks_install_without_clobbering_what_was_there reads the installed script and asserts its `command -v kanbanr || exit 0` guard
    tests:
    - name: scm::tests::hooks_install_without_clobbering_what_was_there
      kind: unit
      state: green
      checked_rev: 34ad27ff8923
