definition:
  statement: Raw activity and event logs that are never truncated, for anyone who needs to know what actually happened, so that a summary can be bounded without the data being lost
  goals:
  - G-0
  - G-2
  zachman:
    what: A folder per log with a file per day, replacing a single file capped at 200 entries
    how: An append touches only today's file; reads take a limit and walk the days newest-first; the existing file is split into the days its entries name
    where: kanbanr-core activity and eventing, and the readers in the CLI, the monitor and the retro
    when: On every write, and once at migration
    who: Whoever reads a retro of an old wave and is told 'no recorded moves' when the moves were simply trimmed away
    why: The 200-entry cap deletes raw history, which the charter forbids, and it silently defeated the retro's own fallback
  requirements:
  - id: R-1
    kind: functional
    text: WHEN an entry is appended to a log, THE SYSTEM SHALL write it to that day's file and SHALL leave every other day untouched.
    tests:
    - name: activity::tests::a_day_file_holds_its_own_entries_and_nothing_is_trimmed
      kind: unit
      state: green
      checked_rev: 9fb8eadfb668
  - id: R-2
    kind: functional
    text: THE SYSTEM SHALL never discard a log entry, however many there are.
    tests:
    - name: activity::tests::a_day_file_holds_its_own_entries_and_nothing_is_trimmed
      kind: unit
      state: green
      checked_rev: 9fb8eadfb668
  - id: R-3
    kind: functional
    text: WHEN a bounded number of recent entries is read, THE SYSTEM SHALL walk the day files newest-first and stop once it has enough.
    tests:
    - name: activity::tests::reads_are_bounded_while_the_data_is_not
      kind: unit
      state: green
      checked_rev: 9fb8eadfb668
  - id: R-4
    kind: functional
    text: WHERE a board still holds a single-file log, THE SYSTEM SHALL split it into the days its entries name, and SHALL keep reading it until that has happened.
    tests:
    - name: activity::tests::an_existing_single_file_log_is_split_by_the_dates_it_holds
      kind: unit
      state: green
      checked_rev: 9fb8eadfb668
  - id: R-5
    kind: functional
    text: WHEN a retrospective covers a period the log does not reach, THE SYSTEM SHALL say the period predates the log rather than reporting that nothing was recorded.
    tests:
    - name: retro::tests::a_period_older_than_the_log_is_named_as_such
      kind: unit
      state: green
      checked_rev: 9fb8eadfb668
