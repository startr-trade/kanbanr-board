definition:
  statement: A way to take back an approval, for the reviewer who changes their mind or was never asked, so that agreement means something that can be revised rather than something irreversible
  goals:
  - G-3
  zachman:
    what: A withdrawal that removes the current approval and is itself recorded
    how: The approval becomes absent, an append-only log on the definition keeps both the agreement and its withdrawal, and the item returns to the review queue
    where: kanbanr-core (models, store), the CLI, and the feature page in the monitor
    when: Whenever a reviewer changes their mind, or an approval was recorded by the wrong hand
    who: The person whose agreement it was — including when it was not theirs
    why: An approval recorded in error had no remedy short of editing yaml by hand, which was found when Claude approved an item on the user's behalf
  requirements:
  - id: R-1
    kind: functional
    text: WHEN an approval is withdrawn, THE SYSTEM SHALL remove it so the item is no longer treated as agreed, and SHALL return the item to what is awaiting review.
    tests:
    - name: tests::an_approval_can_be_withdrawn_and_the_record_survives
      kind: unit
      state: green
      checked_rev: add0c4c824ff
  - id: R-2
    kind: functional
    text: WHEN an approval is given or withdrawn, THE SYSTEM SHALL append it to the item's approval record with who, when and why, and SHALL never remove an earlier entry.
    tests:
    - name: tests::an_approval_can_be_withdrawn_and_the_record_survives
      kind: unit
      state: green
      checked_rev: add0c4c824ff
  - id: R-3
    kind: functional
    text: WHILE an approval is withdrawn, THE SYSTEM SHALL apply the start gate to that item again.
    tests:
    - name: tests::an_approval_can_be_withdrawn_and_the_record_survives
      kind: unit
      state: green
      checked_rev: add0c4c824ff
  - id: R-4
    kind: nfr
    text: THE SYSTEM SHALL leave the definition's content hash unchanged when an approval is recorded or withdrawn.
    iso25010:
    - Maintainability
    scenario:
      stimulus: An approval is given, withdrawn, and given again
      environment: Any item with a definition
      response: The content hash is the same throughout, so the record of who agreed never itself lapses an agreement
      measure: tests::an_approval_can_be_withdrawn_and_the_record_survives compares content_rev before and after both events
    tests:
    - name: tests::an_approval_can_be_withdrawn_and_the_record_survives
      kind: unit
      state: green
      checked_rev: add0c4c824ff
