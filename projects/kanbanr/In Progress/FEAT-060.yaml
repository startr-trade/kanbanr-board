definition:
  statement: A retrospective whose two headline counts are true, for anyone reading it to plan the next wave, so that the report does not manufacture a scope problem and hide real evidence
  goals:
  - G-2
  zachman:
    what: The wave's start time, and what counts as a proven requirement in a historical account
    how: Start from the first recorded transition rather than the earliest creation; count evidence as recorded, leaving staleness to the report
    where: kanbanr-core/src/retro.rs
    when: Every time a retro is run
    who: Whoever reads the retro — its numbers are the ones a narrative may not contradict
    why: Run on kanbanr's own board the first time, it called eleven planned items scope growth and reported 1 of 23 requirements proven when three items were entirely green
  requirements:
  - id: R-1
    kind: functional
    text: WHEN no item of a wave has ever moved, THE SYSTEM SHALL count every item as original rather than as growth.
    tests:
    - name: retro::tests::planned_together_is_not_scope_growth
      kind: unit
      state: planned
  - id: R-2
    kind: functional
    text: WHEN items were created together and work then began, THE SYSTEM SHALL count only the items created after the first transition as growth.
    tests:
    - name: retro::tests::planned_together_is_not_scope_growth
      kind: unit
      state: planned
    - name: retro::tests::scope_growth_counts_only_what_items_record
      kind: unit
      state: planned
  - id: R-3
    kind: functional
    text: WHERE a requirement was recorded green during the wave, THE SYSTEM SHALL count it as proven whatever revision the project is at now.
    tests:
    - name: retro::tests::evidence_recorded_during_the_wave_still_counts
      kind: unit
      state: planned
  started_unapproved: 'auto-pilot: a defect in work just merged; fixing it now with the definition written first'
defect:
  severity: medium
  introduced_by: FEAT-054
  found_in: dogfooding on kanbanr's own board, minutes after merge
  root_cause: 'two defaults chosen without testing them against a real board: a created_at fallback for the wave start, and the report''s HEAD-staleness rule reused in a historical account'
  escaped: true
