definition:
  statement: A wave's lessons shown in that wave's retrospective, for whoever reads it to plan the next one, so that what was learned is found where a reader looks for it
  goals:
  - G-1
  - G-2
  zachman:
    what: The lessons attributable to a wave, rendered into its retrospective document
    how: Derived from the lessons rows at render time, never copied into the document as a second record
    where: kanbanr-core (retro.rs, lessons.rs) and the retro document the CLI writes
    when: Whenever a retrospective is printed or written
    who: Whoever reads a retro — which is where a reader looks for what a wave taught, and where nothing was
    why: Lessons are scored rows so they can be matched and decay, which is right, but it left no view of what one wave learned, and `from_retro` was a field nothing populated
  requirements:
  - id: R-1
    kind: functional
    text: WHEN a retrospective is produced for a wave, THE SYSTEM SHALL include the lessons recorded against that wave's items.
    tests:
    - name: retro::tests::a_waves_lessons_are_part_of_its_retrospective
      kind: unit
      state: planned
    - name: cli_retro_reports_facts_and_writes_a_document
      kind: e2e
      state: planned
  - id: R-2
    kind: functional
    text: WHEN a lesson records the retrospective that promoted it, THE SYSTEM SHALL include that lesson in that retrospective.
    tests:
    - name: retro::tests::a_waves_lessons_are_part_of_its_retrospective
      kind: unit
      state: planned
  - id: R-3
    kind: functional
    text: WHERE a lesson has since retired, THE SYSTEM SHALL still list it in the retrospective of the wave that produced it, marked as retired.
    tests:
    - name: retro::tests::a_waves_lessons_are_part_of_its_retrospective
      kind: unit
      state: planned
  started_unapproved: 'auto-pilot: definition written before the work and left for review'
