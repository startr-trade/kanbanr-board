code: FEAT-065
title: 'The board governs the agent: generated CLAUDE.md block and a docs-location guard'
status: Planned
milestone: MS-006
kind: null
priority: null
start: null
due: null
estimate_days: null
assignee: null
team: null
labels: []
depends_on: []
todo_lists: []
definition:
  statement: The project's own reasoning placed in front of the agent working on it, and the documentation rule enforced rather than requested, so that instructions and board cannot drift apart
  goals:
  - G-1
  - G-5
  - G-3
  zachman:
    what: A generated block in the project's CLAUDE.md, and a guard on writing documentation into the code folder
    how: The block is regenerated between markers and references the board rather than restating it; the guard checks a path mechanically and never judges prose
    where: The project's CLAUDE.md, and a Claude Code PreToolUse hook on Write and Edit
    when: Whenever the charter changes, and on every attempt to write a markdown file
    who: Claude working on this project, and whoever later wonders why it behaved as it did
    why: Instructions that restate the charter drift from it within a week, and the rule that documentation belongs on the board was enforced only by the skill's prose
  requirements:
  - id: R-1
    kind: functional
    text: WHEN the CLAUDE.md block is generated, THE SYSTEM SHALL write the project's purpose, goals, non-goals and constraints between markers and SHALL leave everything outside those markers untouched.
    tests:
    - name: claude::tests::the_block_is_replaced_and_the_rest_of_the_file_is_left_alone
      kind: unit
      state: planned
    - name: cli_claude_sync_and_the_docs_guard
      kind: e2e
      state: planned
  - id: R-2
    kind: functional
    text: WHERE a project has no charter, THE SYSTEM SHALL say so rather than writing an empty block.
    tests:
    - name: cli_claude_sync_and_the_docs_guard
      kind: e2e
      state: planned
  - id: R-3
    kind: functional
    text: WHEN a markdown file is about to be written into the project folder and the board is the system of record, THE SYSTEM SHALL deny it and name the board command that stores it instead.
    tests:
    - name: tests::the_docs_guard_allows_deliverables_and_stops_the_rest
      kind: unit
      state: planned
    - name: cli_claude_sync_and_the_docs_guard
      kind: e2e
      state: planned
  - id: R-4
    kind: functional
    text: WHERE a markdown file is part of what the repository ships, THE SYSTEM SHALL allow it.
    tests:
    - name: tests::the_docs_guard_allows_deliverables_and_stops_the_rest
      kind: unit
      state: planned
  - id: R-5
    kind: nfr
    text: THE SYSTEM SHALL never block a write on the basis of prose it has to interpret.
    iso25010:
    - Reliability
    scenario:
      stimulus: The charter declares a non-goal, and work is done that a reader might argue touches it
      environment: Any project with a charter and the guard installed
      response: The non-goal is shown as context in the generated block and in the session's recovered state; no write is refused because of it
      measure: tests::the_docs_guard_allows_deliverables_and_stops_the_rest asserts the guard's decision depends only on the path and the board's presence, never on charter text
    tests:
    - name: tests::the_docs_guard_allows_deliverables_and_stops_the_rest
      kind: unit
      state: planned
