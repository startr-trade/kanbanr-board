code: FEAT-067
title: Review and approve in the monitor, not the terminal
status: Planned
milestone: MS-006
kind: null
priority: null
start: null
due: null
estimate_days: null
assignee: null
team: null
labels: []
depends_on: []
todo_lists: []
definition:
  statement: Reviewing and approving a definition in the monitor, for the person whose agreement the gate is asking for, so that the gate is cheap enough to use rather than cheap enough to escape
  goals:
  - G-3
  - G-5
  zachman:
    what: A review queue in the monitor, and an approve action that uses the same route the CLI does
    how: The daemon reports whether it accepts writes; the UI offers the action only when it does; approval goes through the existing route and content hash
    where: The view daemon, the web monitor, and a `kanbanr review --ui` that starts one and opens the other
    when: Whenever definitions are waiting for agreement
    who: The person being asked to agree — who is reading prose, not running a command
    why: Eleven briefs read in a terminal and eleven commands typed is friction, and the gate has been escaped on every item so far
  requirements:
  - id: R-1
    kind: functional
    text: WHEN the monitor loads, THE SYSTEM SHALL report whether the daemon accepts writes so the approve action is offered only when it would work.
    tests:
    - name: daemon_reports_whether_it_accepts_writes
      kind: integration
      state: planned
  - id: R-2
    kind: functional
    text: WHEN definitions are waiting for agreement, THE SYSTEM SHALL list them in the monitor with the statement, goals, dimensions and requirement evidence a reader needs.
    tests:
    - name: daemon_lists_what_is_waiting_for_agreement
      kind: integration
      state: planned
  - id: R-3
    kind: functional
    text: WHEN an item is approved in the monitor, THE SYSTEM SHALL record the same approval the CLI records, through the same route and pinned to the same content hash.
    tests:
    - name: approving_through_the_daemon_is_the_same_approval
      kind: integration
      state: planned
  - id: R-4
    kind: functional
    text: WHERE the daemon was started without writes, THE SYSTEM SHALL refuse an approval attempt and leave the board unchanged.
    tests:
    - name: approving_through_the_daemon_is_the_same_approval
      kind: integration
      state: planned
  - id: R-5
    kind: nfr
    text: THE SYSTEM SHALL keep read-only the default, so an ordinary monitor exposes no write route.
    iso25010:
    - Security
    scenario:
      stimulus: A monitor is started the ordinary way and a write is attempted against it
      environment: kanbanr serve with no --allow-writes, on localhost
      response: The write route does not exist and the attempt fails; only an explicit --allow-writes exposes it
      measure: approving_through_the_daemon_is_the_same_approval starts a read-only daemon and asserts the approve route is absent
    tests:
    - name: approving_through_the_daemon_is_the_same_approval
      kind: integration
      state: planned
