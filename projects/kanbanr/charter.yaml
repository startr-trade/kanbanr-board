purpose: |
  An AI agent doing real project work needs a durable, external system of record — not an
  in-session scratchpad. Without one, the plan, the reasoning and the evidence live only in a
  transcript: they vanish between sessions, cannot be reviewed, and work gets built that nobody
  agreed to. kanbanr keeps all of it in plain, git-backed files a human can read, and makes Claude
  keep it current as part of doing the work rather than as an afterthought.
vision: The board is the project's memory, its reasoning and its evidence — not a status report.
goals:
- id: G-1
  statement: A session recovers the full plan and continues, with no human recap
  measure: a new session reaches working context from `kanbanr board` + `feature show` alone
- id: G-2
  statement: Every work item records why it exists and how it will be verified
  measure: doctor reports zero definition gaps on items created since the charter was adopted
- id: G-3
  statement: Nothing substantial gets built before its reasoning is agreed
  measure: no item reaches a terminal state having started unapproved without a recorded reason
- id: G-4
  statement: Any line of code can be traced back to the requirement and goal it serves
  measure: '`kanbanr why <file>` answers for code written after the method was adopted'
- id: G-5
  statement: The tool stays low-friction enough that it is never worth bypassing
  measure: a routine update is one batch call; the board is never edited by hand to save time
- id: G-0
  statement: The system stays operable and maintainable
  measure: maintenance work links here honestly rather than inventing a delivery goal
non_goals:
- An enterprise/team PM platform — the bar is one developer plus their Claude, on one machine
- Horizontal scaling, or multiple server instances over one data dir
- Multi-server merge-conflict resolution (single push-to-backup is the model)
- SSO, role hierarchies, enterprise RBAC, audit-compliance tooling
- A query engine or pagination for tens of thousands of items
- Two-way sync with any external tracker — kanbanr is the source of truth, mirrors follow
stakeholders:
- name: The solo developer
  role: primary user and maintainer
  interest: wants the plan, the reasoning and the evidence to survive between sessions
- name: Claude
  role: the tool's main writer
  interest: needs to recover state and be held to the method without being told each time
- name: Collaborators and reviewers
  role: read-only
  interest: want to see what is being built and why, without running anything
- name: Contributors
  role: occasional
  interest: need the same bar explained, and cheap enough to meet
constraints:
- 'Local-first: plain YAML and markdown in a git repo, no database, no accounts, no server required'
- The CLI is the single writer; the web monitor is read-only
- Sharing happens through a git remote, which is also the access boundary
- One binary, installable without a toolchain beyond cargo
- Raw data is never discarded — it is captured as files and kept; every summary, count and report is derived from it
