schema_version: 5
name: kanbanr
description: "kanbanr's own development board: every item with why it exists, its requirements and the tests that proved them — kanbanr is developed with kanbanr."
statuses:
- Deferred
- Planned
- In Progress
- Completed
- Ongoing
- No Action
- Not Applicable
- Out-of-Scope
default_state: Planned
transitions:
  Completed:
  - In Progress
  Deferred:
  - Planned
  - Ongoing
  - No Action
  - Not Applicable
  - Out-of-Scope
  In Progress:
  - Completed
  - Planned
  - Ongoing
  - No Action
  - Not Applicable
  - Out-of-Scope
  No Action:
  - Planned
  Not Applicable:
  - Planned
  Ongoing:
  - In Progress
  - Planned
  Out-of-Scope:
  - Planned
  Planned:
  - In Progress
  - Deferred
  - Ongoing
  - No Action
  - Not Applicable
  - Out-of-Scope
displayed_states:
- Planned
- In Progress
- Completed
no_op_states:
- No Action
- Not Applicable
- Out-of-Scope
terminal_states: []
gates:
  "@build":
    requires:
    - spec_sections:
      - Design
    signoffs:
    - design-review
  "@integrate":
    requires:
    - docs_updated
    signoffs:
    - docs-folded
  Completed:
    roles:
    - integrate
    - release
  In Progress:
    roles:
    - build
  Planned:
    roles:
    - design
cadence:
  sprints: true
  releases: true
  sprint_length_days: 7
  release: on_demand
  release_stages:
  - candidate
  - main
  - production
  git_model: true
  release_gates:
    candidate:
      on_enter:
      - branch
      - prepare
