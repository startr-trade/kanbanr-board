schema_version: 5
name: kanbanr
description: "kanbanr's own development board: every item with why it exists, its requirements and the tests that proved them — kanbanr is developed with kanbanr."
statuses:
- Deferred
- Planned
- In Progress
- Completed
- Ongoing
- No Action
- Not Applicable
- Out-of-Scope
default_state: Planned
transitions:
  Completed:
  - In Progress
  Deferred:
  - Planned
  - Ongoing
  - No Action
  - Not Applicable
  - Out-of-Scope
  In Progress:
  - Completed
  - Planned
  - Ongoing
  - No Action
  - Not Applicable
  - Out-of-Scope
  No Action:
  - Planned
  Not Applicable:
  - Planned
  Ongoing:
  - In Progress
  - Planned
  Out-of-Scope:
  - Planned
  Planned:
  - In Progress
  - Deferred
  - Ongoing
  - No Action
  - Not Applicable
  - Out-of-Scope
displayed_states:
- Planned
- In Progress
- Completed
no_op_states:
- No Action
- Not Applicable
- Out-of-Scope
terminal_states: []
gates:
  "@build":
    requires:
    - spec_sections:
      - Design
    signoffs:
    - design-review
  "@integrate":
    requires:
    - docs_updated
    signoffs:
    - docs-folded
  Completed:
    roles:
    - integrate
    - release
  In Progress:
    roles:
    - build
  Planned:
    roles:
    - design
cadence:
  sprints: true
  releases: true
  sprint_length_days: 7
  release: on_demand
  release_stages:
  - candidate
  - main
  - production
  git_model: true
  release_gates:
    candidate:
      on_enter:
      - branch
      - prepare
    main:
      purpose: main holds the release; push it and let CI run
      requires:
      - items_finished
      on_enter:
      - move_main
    production:
      requires:
      - main_at_release
      - pushed
      on_enter:
      - tag
  release_prepare:
    version_files:
    - path: api/Cargo.toml
    - path: api/Cargo.lock
      match: |-
        name = "kanbanr-core"
        version = "{version}"
    - path: api/Cargo.lock
      match: |-
        name = "kanbanr-cli"
        version = "{version}"
    - path: api/Cargo.lock
      match: |-
        name = "kanbanr-server"
        version = "{version}"
    - path: editor/vscode/package.json
    - path: editor/vscode/package-lock.json
      match: "\"name\": \"kanbanr\", \"version\": \"{version}\""
    - path: web/package.json
    - path: web/package-lock.json
      match: "\"name\": \"kanbanr-web\", \"version\": \"{version}\""
    - path: .claude-plugin/plugin.json
    changelog: CHANGELOG.md
    changelog_copies:
    - docs/src/project/changelog.md
    notes: docs/src/releases/{version}.md
    notes_listings:
    - path: docs/src/SUMMARY.md
      after: "- [Release notes](releases/index.md)"
      entry: "  - [{number}](releases/{version}.md)"
    - path: docs/src/releases/index.md
      after: work toward 1.0's [stability promise](../project/stability.md).
      entry: "- **[{number}]({version}.md)**"
method:
  chosen_at: 2026-10-19T15:48:07.297587475Z
codes:
  kinds:
    bug: DEF
    chore: MNT
    defect: DEF
    docs: DOC
    feature: FTR
    recurring: MNT
    refactor: MNT
    spike: SPK
