definition:
  statement: An honest account of how a wave actually went, for the developer planning the next one, so that the lesson survives the wave
  goals:
  - G-2
  - G-0
  zachman:
    what: Scope growth split by what each added item records, defects and escapes, cycle time, rework, evidence at completion, estimate against actual
    how: Everything is derived from history[], the defect blocks and the test states; where an item records nothing, the retro says unknown instead of inferring a cause
    where: kanbanr-core (retro.rs), a read-only route, the CLI, and a document in the board's retros/ folder
    when: On demand, over a sliding window, and when the last open item of a milestone finishes
    who: The developer reading it; Claude, which writes the narrative from the numbers and may not contradict them
    why: A wave grows while it runs — defects found inside it are added to it — so 'we finished twelve items' hides that four of them were damage the wave caused
  requirements:
  - id: R-1
    kind: functional
    text: 'WHEN a retrospective is asked for a wave, THE SYSTEM SHALL report only numbers derived from what the board recorded: scope growth, defects and escapes, cycle time, rework, requirement evidence and estimate against actual.'
    tests:
    - name: retro::tests::the_numbers_come_from_the_board_and_nowhere_else
      kind: unit
      state: green
      checked_rev: 5a86594f316f
  - id: R-2
    kind: functional
    text: WHERE an item joined a wave after the wave began, THE SYSTEM SHALL classify it by what the item itself records — a defect, a split from a named item, or newly discovered — and count it as unclassified rather than guessing.
    tests:
    - name: retro::tests::scope_growth_counts_only_what_items_record
      kind: unit
      state: green
      checked_rev: 5a86594f316f
  - id: R-3
    kind: functional
    text: IF an item carries no transition history, THEN THE SYSTEM SHALL recover its moves from the activity log and report it as having no history when neither source has them.
    tests:
    - name: retro::tests::history_falls_back_to_the_activity_log
      kind: unit
      state: green
      checked_rev: 5a86594f316f
  - id: R-4
    kind: functional
    text: WHEN the last item of a milestone that was not yet finished reaches a terminal status, THE SYSTEM SHALL emit a milestone-completed event.
    tests:
    - name: eventing::tests::finishing_the_last_item_completes_the_milestone
      kind: unit
      state: green
      checked_rev: 5a86594f316f
  - id: R-5
    kind: functional
    text: WHILE a finished milestone has no retrospective document, THE SYSTEM SHALL report that retrospective as due.
    tests:
    - name: retro::tests::a_finished_wave_with_no_document_is_due
      kind: unit
      state: green
      checked_rev: 5a86594f316f
  - id: R-6
    kind: functional
    text: WHEN a retrospective is written to a document, THE SYSTEM SHALL keep the computed facts and any written narrative in separate labelled sections.
    tests:
    - name: cli_retro_reports_facts_and_writes_a_document
      kind: e2e
      state: green
      checked_rev: 5a86594f316f
