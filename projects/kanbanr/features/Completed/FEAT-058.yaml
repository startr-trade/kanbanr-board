definition:
  statement: Move the workspace to Rust 1.98.1 and edition 2024, pinned, so the maintainer, Docker and CI build the same way and stop drifting apart.
  goals:
  - G-0
  zachman:
    what: The workspace edition, a pinned toolchain, a declared MSRV, and the Docker build base.
    how: cargo fix --edition, then rust-toolchain.toml, rust-version, and the Dockerfile base bump.
    where: api/Cargo.toml, rust-toolchain.toml, docker/Dockerfile, .github/workflows.
    when: Once, at a point where the tree is merged and green; bumped deliberately thereafter.
    who: The maintainer and any contributor building the workspace.
    why: Local was 1.96, Docker pinned 1.95 and CI floated on stable, so the three could disagree.
  requirements:
  - id: R-1
    kind: functional
    text: THE SYSTEM SHALL continue to build, pass every workspace test, and read an existing board unchanged after the edition migration.
    tests:
    - name: cargo test --workspace
      kind: integration
      state: green
    - name: 'legacy invariant: kanbanr board && feature show FEAT-001 rewrite no file'
      kind: manual
      state: green
  - id: R-2
    kind: functional
    text: WHERE a toolchain is pinned, THE SYSTEM SHALL build with the same rustc version locally, in Docker and in CI.
    tests:
    - name: rust-toolchain.toml matches the Dockerfile base
      kind: manual
      state: green
  - id: R-3
