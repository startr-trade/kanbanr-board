definition:
  statement: A project folder whose top level lists kinds of thing rather than states of one, for anyone reading the board on disk, so that the layout grows with the model and not with the workflow
  goals:
  - G-0
  - G-5
  zachman:
    what: Status folders moved from the project root to features/
    how: One helper decides where a status folder is; reads accept both shapes and the first write moves the old one
    where: kanbanr-core store paths
    when: On the first write to a board that still has the old shape
    who: Whoever opens the board folder and has to tell states apart from entities
    why: Nine of eleven root directories were statuses of a single entity, sitting beside milestones, docs and the logs, so adding a status grew the root
  requirements:
  - id: R-1
    kind: functional
    text: WHEN an item is written, THE SYSTEM SHALL store it under features/<status>/ rather than at the project root.
    tests:
    - name: tests::status_change_moves_the_files
      kind: unit
      state: green
      checked_rev: 137f43058627
  - id: R-2
    kind: functional
    text: WHERE a board still keeps status folders at its root, THE SYSTEM SHALL read it unchanged and SHALL move those folders under features/ on the next write.
    tests:
    - name: tests::a_board_with_status_folders_at_the_root_is_migrated_on_the_next_write
      kind: unit
      state: green
      checked_rev: 137f43058627
  - id: R-3
    kind: nfr
    text: THE SYSTEM SHALL never leave an item file in neither location while migrating.
    iso25010:
    - Reliability
    scenario:
      stimulus: A board with root status folders is written to
      environment: Any board created before this change
      response: Each folder is moved only after its destination exists, and a failure leaves the original in place
      measure: tests::a_board_with_status_folders_at_the_root_is_migrated_on_the_next_write asserts the item is readable before, present under features/ after, and that the root folder is gone rather than duplicated
    tests:
    - name: tests::a_board_with_status_folders_at_the_root_is_migrated_on_the_next_write
      kind: unit
      state: green
      checked_rev: 137f43058627
  started_unapproved: 'auto-pilot: the user proposed this layout and asked for it'
