definition:
  statement: A released Linux binary that starts on the distributions we tell people it supports, for anyone installing it, so that the one-line install does not end in a linker error
  goals:
  - G-5
  - G-0
  zachman:
    what: The glibc version the published Linux binaries link against
    how: Build the Linux legs on the oldest supported runner (Ubuntu 22.04, glibc 2.35); verify-install brackets the claimed range with bookworm and 24.04; the floor is documented
    where: .github/workflows/release.yml, docs/INSTALL.md
    when: On every release
    who: Anyone on Debian stable, which is most servers
    why: A -gnu target links the runner's glibc, and building on the newest runner makes the binary require a version Debian stable does not have; the Dockerfile already recorded this failure and the release matrix repeated it
  requirements:
  - id: R-1
    kind: functional
    text: WHEN a Linux binary is published, THE SYSTEM SHALL link a glibc no newer than the oldest distribution the documentation claims to support.
    tests:
    - name: 'release.yml verify-install: the published one-liner installs and serves the monitor in a clean container'
      kind: e2e
      state: planned
  - id: R-2
    kind: functional
    text: WHERE a platform floor is claimed, THE SYSTEM SHALL state it in the installation documentation together with what its violation looks like at runtime.
    tests:
    - name: docs/INSTALL.md names the glibc floor and quotes the startup error
      kind: manual
      state: green
