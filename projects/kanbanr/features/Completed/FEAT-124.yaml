definition:
  statement: Session summaries that leave out whatever the user lists as confidential, for anyone whose sessions touch private matters, so that nothing on that list ever reaches the board
  goals:
  - G-1
  - G-0
  zachman:
    what: What the session-summary hooks may write to the board
    how: A private term list read by the summariser; messages with a term are dropped before the model sees them, and lines with a term are removed from any summary before it is saved
    where: skill/kanbanr/hooks/summarise_session.py, session-summary hooks README
    when: Every compaction, session end and start-up sweep
    who: The user, whose confidential topics must stay off the board
    why: The summaries would otherwise copy confidential discussion onto the board and into its history
  requirements:
  - id: R-1
    kind: functional
    text: WHEN a session is summarised, THE SYSTEM SHALL drop every transcript message containing a term from the exclusion list before sending the transcript to the model.
    tests:
    - name: 'manual: excluded messages never reach the model (condensed input checked)'
      kind: manual
      state: green
  - id: R-2
    kind: functional
    text: WHEN a summary or a compaction summary is saved, THE SYSTEM SHALL remove every line containing a term from the exclusion list first.
    tests:
    - name: 'manual: a compaction summary with an excluded term is saved without it'
      kind: manual
      state: green
