definition:
  statement: A container image built with Debian's published security fixes, for anyone running kanbanr from GHCR, so that a known, fixed vulnerability never ships and releases don't wait on base-image rebuilds
  goals:
  - G-0
  - G-6
  zachman:
    what: The runtime stage of the container image
    how: Both stages on Debian 13 trixie, and apt-get upgrade in the runtime stage before the binary is copied in
    where: docker/Dockerfile
    when: 'On every image build: make ci and the release'
    who: Anyone running the kanbanr image
    why: The release's scan refuses CVE-2026-103111 in libpcre2-8-0, which the base image has not picked up
  requirements:
  - id: R-1
    kind: functional
    text: WHEN the image is built, THE SYSTEM SHALL include every security fix Debian has published for its packages.
    tests:
    - name: make ci's image scan finds no fixable HIGH or CRITICAL finding
      kind: manual
      state: green
  - id: R-2
    kind: functional
    text: THE SYSTEM SHALL build and run its container image on the current Debian stable release.
    tests:
    - name: the image's build and runtime stages are trixie, and the image passes scripts/check-image.sh
      kind: manual
      state: green
