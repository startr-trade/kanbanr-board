definition:
  statement: Release stages and promotion, for a solo developer and their reviewers, so that a release's position (test, staging, production) is recorded and production is one deliberate act that tags, merges to main and moves its items to their terminal status.
  goals:
  - G-5
  - G-3
  zachman:
    what: Release stage field and history; promote command; branch, tag and merge on cut
    how: A stage and stage history on each release, from cadence.release_stages; promote preflights board and repository, then tags the release and fast-forwards main to it through core coderepo.rs (refused if main has commits the release lacks), then cuts, rolling the git steps back if the board step fails; the daemon uses the code repository it was started in
    where: kanbanr-core releases, CLI release commands, git integration
    when: When a release is promoted between stages; production is the cut
    who: the solo developer, collaborators and reviewers
    why: A release deployed to environments before production has no recorded position, and the production cut is disconnected from the code repository
  requirements:
  - id: R-1
    kind: functional
    text: THE SYSTEM SHALL record a release's current stage from a configurable list, with each stage change's actor and time.
    tests:
    - name: release_stage_recorded_with_history
      kind: unit
      state: green
  - id: R-2
    kind: functional
    text: WHEN a release is promoted to candidate, THE SYSTEM SHALL create the branch `release/<VERSION>` from the project's integration branch.
    tests:
    - name: promote_candidate_creates_branch
      kind: integration
      state: green
  - id: R-3
    kind: functional
    text: WHEN a release is promoted to production, THE SYSTEM SHALL cut it, tag the code repository with its version, and merge the release branch into the main branch.
    tests:
    - name: promote_production_cuts_tags_merges
      kind: integration
      state: green
  - id: R-4
    kind: functional
    text: IF the release branch cannot merge cleanly into the main branch, THE SYSTEM SHALL refuse the production promotion and change nothing.
    tests:
    - name: promote_production_refuses_unclean_merge
      kind: integration
      state: green
  - id: R-5
    kind: functional
    text: WHEN a release is promoted to an earlier stage, THE SYSTEM SHALL require a reason and record it, and SHALL refuse any move back from production.
    tests:
    - name: promote_back_requires_reason_and_not_from_production
      kind: unit
      state: green
