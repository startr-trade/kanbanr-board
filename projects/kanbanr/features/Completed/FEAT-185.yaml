definition:
  statement: Release actions in the monitor, for a solo developer, so that adding a ready item to a release and promoting a release are one click each with the same effect as the CLI.
  goals:
  - G-5
  zachman:
    what: Add-to-release question in the review queue; promote action on the Releases page
    how: 'A release question kind in the review queue (choices: planned releases and New release) and a Promote action on the Releases page, both calling the same core operations as the CLI through the writes-enabled daemon'
    where: web monitor, dispatch routes for release plan and promote
    when: When an item becomes ready for release; when a release is promoted
    who: the solo developer
    why: Release decisions otherwise need the terminal
  requirements:
  - id: R-1
    kind: functional
    text: WHEN an item enters the stage before the terminal one and releases are on, THE SYSTEM SHALL ask in the review queue which planned release it belongs to.
    tests:
    - name: review_queue_asks_release_for_ready_item
      kind: unit
      state: green
  - id: R-2
    kind: functional
    text: WHEN the user chooses Promote on a release, THE SYSTEM SHALL perform the same promotion as `kanbanr release promote`.
    tests:
    - name: monitor_promote_matches_cli
      kind: integration
      state: green
  - id: R-3
    kind: functional
    text: THE SYSTEM SHALL state in the skill that Claude asks the same which-release question from the review queue.
    tests:
    - name: 'manual: skill release question present and matches the monitor'
      kind: manual
      state: green
