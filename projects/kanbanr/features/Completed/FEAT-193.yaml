definition:
  statement: The same design and documentation discipline in every built-in process by default, for every project, so that no project needs hand-written rules to get it.
  goals:
  - G-2
  - G-3
  zachman:
    what: Default gates at the build and integrate roles; an opt-out
    how: Core method.rs states the method once as gate pieces placed by role (spec_sections and design-review at build; docs_updated and docs-folded at integrate; the links scan); presets apply it, preset_bare keeps the YAML as written; kanbanr config method --on/--off per part, recorded and respected by preset, init and process update
    where: kanbanr-core presets and config; docs
    when: When a project is created or a preset applied
    who: the solo developer, Claude
    why: Today the method holds only where someone hand-wrote it into a project
  requirements:
  - id: R-1
    kind: functional
    text: 'THE SYSTEM SHALL include, in every built-in preset, `spec_sections: [Design]` and a `design-review` sign-off at the build role, and `docs_updated` and a `docs-folded` sign-off at the integrate role.'
    tests:
    - name: presets_include_method_gates
      kind: unit
      state: green
  - id: R-2
    kind: functional
    text: WHEN `kanbanr config method --off` runs, THE SYSTEM SHALL remove those gates from the project's workflow and record the choice.
    tests:
    - name: method_gates_opt_out
      kind: integration
      state: green
