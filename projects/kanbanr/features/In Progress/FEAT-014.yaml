definition:
  statement: A way to reach the board from inside the editor, for a developer who is already there, so that checking the plan costs no context switch
  goals:
  - G-5
  zachman:
    what: A VS Code extension that opens the monitor and runs the common board commands
    how: It drives the same CLI and daemon everything else does, adding no second write path
    where: editor/vscode/
    when: While working in the editor, which is where the questions arise
    who: A developer who would otherwise leave the editor to ask the board a question
    why: The friction of switching tools is what makes a plan go unread, and an unread plan drifts
  requirements:
  - id: R-1
    kind: functional
    text: WHEN the extension is asked to open the board, THE SYSTEM SHALL start or reuse the local daemon and show the monitor.
    tests:
    - name: 'F5 launch: openBoard, serve, board, addFeature and move work against the daemon'
      kind: manual
      state: planned
  - id: R-2
    kind: functional
    text: THE SYSTEM SHALL add no write path of its own, driving the CLI instead.
    tests:
    - name: the extension source contains no direct data-folder writes; every mutation shells out to the CLI
      kind: manual
      state: green
  - id: R-3
    kind: functional
    text: WHEN the extension is packaged, THE SYSTEM SHALL install and run from the built artifact in a clean editor.
    tests:
    - name: vsce package, then install the .vsix in a clean VS Code and run the commands
      kind: manual
      state: planned
