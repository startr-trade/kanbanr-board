definition:
  statement: A review queue holding only the items where agreement still changes something, for the reviewer being asked to decide, so that the gate stays cheap enough to be read rather than rubber-stamped
  goals:
  - G-3
  - G-5
  zachman:
    what: Which items the review queue offers for agreement
    how: The queue applies the same scope gate the doctor uses — not terminal, not a no-op disposition — and orders what remains so in-flight work comes first
    where: core/dispatch.rs (GET /projects/{p}/review)
    when: Whenever the review queue is read, by `kanbanr review --pending` or the monitor
    who: The reviewer, who was shown six items when two were decisions
    why: Approving must be cheap or it becomes theatre; asking for four retroactive signatures beside two real decisions teaches clicking without reading, and does it on the items where a signature means least
  requirements:
  - id: R-1
    kind: functional
    text: WHEN the review queue is read, THE SYSTEM SHALL exclude items in a terminal or no-op status, so that agreement is only sought where it can still change what happens.
    tests:
    - name: tests::the_review_queue_asks_only_where_agreement_still_matters
      kind: unit
      state: green
  - id: R-2
    kind: functional
    text: WHEN the review queue holds items in different statuses, THE SYSTEM SHALL order work already in progress before work that has not started.
    tests:
    - name: tests::the_review_queue_asks_only_where_agreement_still_matters
      kind: unit
      state: green
  - id: R-3
    kind: nfr
    text: THE SYSTEM SHALL decide the review queue's scope and the doctor's scope from one shared rule, so that the two surfaces cannot report different answers to the same question.
    iso25010:
    - Maintainability
    scenario:
      stimulus: A status is added to the workflow, or the scope rule changes
      environment: Any board
      response: Both the doctor and the review queue change together
      measure: tests::the_review_queue_asks_only_where_agreement_still_matters asserts the queue's membership equals graph::is_live_work for every status on one fixture
    tests:
    - name: tests::the_review_queue_asks_only_where_agreement_still_matters
      kind: unit
      state: green
  started_unapproved: 'auto-pilot: found verifying FEAT-077; the queue and the doctor disagreed on the live board'
defect:
  severity: medium
  introduced_by: FEAT-067
  found_in: the monitor, verifying the FEAT-077 fix
  root_cause: the queue was written as a new filter over all features instead of reusing the scope gate the doctor already had, so the same question acquired two answers
  escaped: true
