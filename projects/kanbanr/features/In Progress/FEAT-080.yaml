definition:
  statement: A recorded bypass that stays visible until someone answers it, and an approval record that can tell agreement before the work from agreement after it, for anyone auditing whether the gate was honoured, so that finishing is not how a question stops being asked
  goals:
  - G-3
  - G-0
  zachman:
    what: What happens to `started_unapproved` after the work it excuses reaches a terminal status, and how after-the-fact agreement is recorded
    how: A `ratified` verdict distinct from `approved`, derived into its own ApprovalState from the log's last verdict; doctor reports an unreconciled bypass past the terminal gate that silences every other check
    where: core/models.rs, core/store.rs, core/doctor.rs, core/export.rs, core/dispatch.rs, cli (kanbanr ratify)
    when: When work started under a bypass reaches a terminal status, and when someone agrees to it afterwards
    who: Anyone auditing whether the gate was honoured — and the maintainer, who had no list to work from
    why: The bypass was honestly recorded and then listed by nothing once the item completed. Worse, the 29 items already reconciled by approving them late were recorded with the same verdict as prior agreement, so the record could not tell 'we agreed, then built' from 'we built, then agreed' — the one distinction the gate exists to draw
  requirements:
  - id: R-1
    kind: functional
    text: WHEN agreement is given to work that started under a recorded bypass, THE SYSTEM SHALL record it as a verdict distinct from approval given before the work.
    tests:
    - name: tests::agreement_after_the_work_is_recorded_as_a_different_verdict
      kind: unit
      state: planned
  - id: R-2
    kind: functional
    text: WHERE an item did not start under a recorded bypass, THE SYSTEM SHALL refuse to ratify it, so that ratification cannot become a shortcut around review.
    tests:
    - name: tests::agreement_after_the_work_is_recorded_as_a_different_verdict
      kind: unit
      state: planned
  - id: R-3
    kind: functional
    text: WHILE a recorded bypass is unanswered, THE SYSTEM SHALL report it even after the item reaches a terminal status, so that finishing does not silence the question.
    tests:
    - name: doctor::tests::an_unreconciled_bypass_outlives_the_terminal_gate
      kind: unit
      state: planned
  - id: R-4
    kind: functional
    text: WHEN a ratified definition changes afterwards, THE SYSTEM SHALL lapse the agreement exactly as it lapses an approval, because it no longer covers what was built.
    tests:
    - name: tests::agreement_after_the_work_is_recorded_as_a_different_verdict
      kind: unit
      state: planned
  - id: R-5
    kind: functional
    text: WHEN a verdict is recorded from the command line without an explicit author, THE SYSTEM SHALL attribute it to the data folder's commit identity, and SHALL refuse when there is none.
    tests:
    - name: tests::agreement_after_the_work_is_recorded_as_a_different_verdict
      kind: unit
      state: planned
