definition:
  statement: Session-summary hooks that ship with kanbanr and are registered by `kanbanr hooks install`, for every project tracked with kanbanr, so that session history reaches the board on any machine rather than only on the one where the scripts were written
  goals:
  - G-1
  - G-0
  zachman:
    what: The session-summary hook scripts and their registration
    how: Move the scripts into skill/kanbanr/hooks and add their events to the hooks install table
    where: skill/kanbanr/hooks, api/crates/kanbanr-cli/src/hooks.rs, .gitignore
    when: At hooks install (and so at init); the hooks fire on PostCompact, SessionEnd and SessionStart
    who: Anyone using kanbanr with Claude Code
    why: The scripts sit in a gitignored folder, so they are unversioned, exist on one machine only, and no other project gets them
  requirements:
  - id: R-1
    kind: functional
    text: WHEN kanbanr hooks install runs, THE SYSTEM SHALL register the session-summary hook for PostCompact, SessionEnd and SessionStart, pointing at the script shipped with the skill.
    tests:
    - name: hooks::tests::install_registers_session_summary
      kind: unit
      state: green
      checked_rev: 190187661e2b
  - id: R-2
    kind: functional
    text: WHEN kanbanr hooks uninstall runs, THE SYSTEM SHALL remove the session-summary entries and leave other hooks alone.
    tests:
    - name: hooks::tests::uninstall_removes_session_summary
      kind: unit
      state: green
      checked_rev: 190187661e2b
  - id: R-3
    kind: functional
    text: THE SYSTEM SHALL keep the session-summary scripts under version control, and ignore only the machine-local parts of .claude/.
    tests:
    - name: 'manual: git ls-files lists the scripts; git check-ignore matches only the machine-local .claude paths'
      kind: manual
      state: green
