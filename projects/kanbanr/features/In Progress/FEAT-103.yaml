definition:
  statement: Reads that never create a board folder, for anyone running kanbanr in a folder it does not track, so that looking around leaves no stray data behind
  goals:
  - G-5
  - G-0
  zachman:
    what: Data-folder resolution for commands run where no board is configured
    how: Resolve without creating; only init (and explicit --data-dir writes) may create the folder
    where: kanbanr-cli store opening (main.rs / backend.rs)
    when: Any command run in a folder with no marker, no env var and no ./data
    who: Anyone exploring a folder before or without setting up kanbanr, including Claude in plan mode
    why: A read created ./data/projects in katalog during the read-only interview, leaving a stray folder that looks like a board
  requirements:
  - id: R-1
    kind: functional
    text: WHEN a read command runs in a folder where no board resolves and ./data does not exist, THE SYSTEM SHALL create no files and report that no board is configured.
    tests:
    - name: cli_reads_in_an_untracked_folder_create_nothing
      kind: integration
      state: green
  - id: R-2
    kind: functional
    text: WHILE a legacy ./data board exists, THE SYSTEM SHALL keep reading and writing it as before.
    tests:
    - name: cli_reads_in_an_untracked_folder_create_nothing
      kind: integration
      state: planned
