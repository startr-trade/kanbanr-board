code: FEAT-105
title: 'Defect: in a fresh repo the git hooks call the default branch `main` while HEAD is an unborn `master`, and refuse the first commit'
status: In Progress
milestone: MS-006
kind: defect
priority: null
start: null
due: null
estimate_days: null
assignee: null
team: null
labels: []
depends_on: []
todo_lists: []
definition:
  statement: Git hooks that recognise a fresh repository's real default branch and let its first commit through, for anyone starting a new project under kanbanr, so that setup does not end in a repository that cannot be committed to
  goals:
  - G-5
  - G-4
  zachman:
    what: Default-branch detection and the pre-commit branch check for repositories with no commits
    how: Read the unborn HEAD's name; allow a root commit on it; `start` refuses until one exists
    where: api/crates/kanbanr-cli/src/scm.rs, main.rs (check-branch, start)
    when: The first commits of a new repository
    who: Anyone setting up a new project with the git hooks
    why: The hooks named a branch that does not exist and refused the only commit a new repo can make
  requirements:
  - id: R-1
    kind: functional
    text: WHILE the repository has no commits, THE SYSTEM SHALL report the unborn HEAD's branch as the default branch.
    tests:
    - name: scm::tests::an_unborn_head_is_the_default_branch
      kind: unit
      state: green
  - id: R-2
    kind: functional
    text: WHEN the root commit is made on the default branch, THE SYSTEM SHALL allow it.
    tests:
    - name: cli_the_first_commit_of_a_new_repo_is_allowed
      kind: integration
      state: planned
  - id: R-3
    kind: functional
    text: IF kanbanr start runs in a repository with no commits, THEN THE SYSTEM SHALL refuse and say to make the initial commit first.
    tests:
    - name: cli_the_first_commit_of_a_new_repo_is_allowed
      kind: integration
      state: planned
