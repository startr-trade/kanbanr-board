definition:
  statement: Start, finish and auto-advance that follow the project's workflow and gates, for anyone using a process other than the default, so that the branch appears when code starts and finishing works from any valid stage
  goals:
  - G-5
  - G-3
  zachman:
    what: Where start, finish and auto-advance move an item
    how: Targets derived from gates (on_enter) and allowed transitions; auto-advance evaluates the gate
    where: kanbanr-cli run_start/run_finish/first_active_status; store.rs set_task_state_on
    when: On start, finish and completing the last task
    who: Anyone on TOGAF, PDCA or a custom workflow
    why: Branching at Business Arch, finish refused from Implementation, and an auto-advance that bypassed checks
  requirements:
  - id: R-1
    kind: functional
    text: WHEN start runs, THE SYSTEM SHALL move the item to the status whose gate declares the branch action and create the branch there.
    tests:
    - name: start_branches_where_the_gate_says
      kind: integration
      state: green
  - id: R-2
    kind: functional
    text: WHEN finish runs, THE SYSTEM SHALL target a terminal status reachable by an allowed transition from the current status.
    tests:
    - name: finish_reaches_a_terminal_through_an_allowed_edge
      kind: integration
      state: planned
  - id: R-3
    kind: functional
    text: WHEN every task completes and the terminal gate fails, THE SYSTEM SHALL leave the item where it is and report why.
    tests:
    - name: auto_advance_respects_the_gate
      kind: unit
      state: planned
