definition:
  statement: Story-point estimates and cadence defaults chosen per project, for teams planning in points, so that capacity, velocity and the Definition of Ready use the unit the project works in
  goals:
  - G-5
  zachman:
    what: The estimate unit and cadence; plus `cadence.sprints` / `cadence.releases` switches (default off) that decide whether a project has sprints, releases and burn-rate reports at all
    how: An item field and two config fields; one check
    where: models.rs, config.rs, readiness.rs, kanbanr-cli
    when: Estimating and planning
    who: The developer and Claude
    why: Only day estimates existed and cadence had nowhere to live
  requirements:
  - id: R-1
    kind: functional
    text: WHERE a project's estimate unit is points, THE SYSTEM SHALL use points for the estimated check, capacity and velocity.
    tests:
    - name: the_estimate_unit_drives_capacity_and_checks
      kind: unit
      state: green
  - id: R-2
    kind: functional
    text: WHERE a project has not switched sprints or releases on, THE SYSTEM SHALL create no sprint or release data and refuse those commands with how to switch them on.
    tests:
    - name: cadence_capabilities_are_off_unless_switched_on
      kind: unit
      state: green
