definition:
  statement: Sprint and release views in the monitor, for anyone following an iteration, so that its state and the timeline are visible at a glance
  goals:
  - G-1
  - G-5
  zachman:
    what: The monitor's cadence views
    how: Read-only views over the sprint and release side files and history
    where: web/src pages (Board, Releases new, Gantt, Schedule), dispatch.rs read routes
    when: While iterations run
    who: The user and reviewers
    why: Cadence data would otherwise be visible only in the CLI
  requirements:
  - id: R-1
    kind: functional
    text: WHILE a sprint is active, THE SYSTEM SHALL show its goal, dates, days left, committed versus done, and burndown on the board.
    tests:
    - name: 'manual: sprint header and burndown screenshot'
      kind: manual
      state: green
  - id: R-2
    kind: functional
    text: THE SYSTEM SHALL show sprints and releases on the Gantt timeline.
    tests:
    - name: 'manual: gantt with sprints and releases renders'
      kind: manual
      state: green
  - id: R-3
    kind: functional
    text: WHERE a project has sprints or releases off, THE SYSTEM SHALL hide the corresponding monitor views.
    tests:
    - name: 'manual: cadence views hidden on a project without sprints or releases'
      kind: manual
      state: planned
