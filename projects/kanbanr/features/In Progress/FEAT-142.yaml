definition:
  statement: A board that reaches its remote, pushed as its owner chose, for anyone sharing a board through GitHub or any git host, so that a shared board does not silently fall behind
  goals:
  - G-1
  - G-5
  - G-0
  zachman:
    what: Whether kanbanr can reach a network remote at all; when a board is pushed; where that choice is recorded; what sync reports
    how: Build git2 with ssh and https; count unpushed commits from git; keep the policy in the board's git config as kanbanr.push with KANBANR_PUSH as an override; never clear the unpushed mark on a failed push; doctor warns when far behind
    where: kanbanr-cli backend.rs (push policy), kanbanr-core git.rs (ahead count, setting), kanbanr-cli main.rs (remote push-policy), doctor.rs, docs/src/using/the-monitor.md
    when: After every commit kanbanr makes to a board with a remote
    who: Anyone whose board has a remote — kanbanr's own, published
    why: sync failed with 'unsupported URL protocol' and then claimed there was nothing to sync; the CLI's batched push never fired; the policy was only an environment variable
  requirements:
  - id: R-1
    kind: functional
    text: WHEN a board's remote is reached over SSH or HTTPS, THE SYSTEM SHALL push to it.
    tests:
    - name: kanbanr sync pushes a board to an SSH git server in a container (and to GitHub, by hand)
      kind: manual
      state: red
  - id: R-2
    kind: functional
    text: IF a push fails, THEN THE SYSTEM SHALL keep the board marked as unpushed, report the failure and exit non-zero.
    tests:
    - name: backend::tests::a_failed_push_is_reported_and_stays_pending
      kind: unit
      state: green
  - id: R-3
    kind: functional
    text: WHILE a board's push policy is debounce with threshold N, WHEN a commit leaves the board N or more commits ahead of its remote, THE SYSTEM SHALL push.
    tests:
    - name: backend::tests::a_debounced_board_pushes_across_separate_commands
      kind: unit
      state: planned
  - id: R-4
    kind: functional
    text: WHEN a board has a push policy in its git config, THE SYSTEM SHALL apply it unless KANBANR_PUSH overrides it.
    tests:
    - name: backend::tests::the_board_setting_applies_and_the_environment_overrides_it
      kind: unit
      state: planned
  - id: R-5
    kind: functional
    text: IF a board with a remote is more commits ahead of it than its push threshold, THEN THE SYSTEM SHALL warn in doctor.
    tests:
    - name: doctor::tests::a_board_far_ahead_of_its_remote_is_reported
      kind: unit
      state: planned
