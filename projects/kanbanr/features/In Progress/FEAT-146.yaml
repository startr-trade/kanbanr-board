  - id: R-1
    kind: functional
    text: WHEN v0.1.1 is tagged, THE SYSTEM SHALL publish binaries and an image whose kanbanr reports 0.1.1, the tagged commit, and the repository's skill.
    tests:
    - name: the v0.1.1 release run passes, and the GHCR image passes scripts/check-image.sh at the tag
      kind: manual
      state: planned
  - id: R-2
    kind: functional
    text: THE SYSTEM SHALL record v0.1.0 as released on 2026-10-01 and the image fixes under 0.1.1 in its changelog.
    tests:
    - name: the changelog has a dated 0.1.1 section with FEAT-144 and FEAT-145, and 0.1.0 dated 2026-10-01
      kind: manual
      state: planned
