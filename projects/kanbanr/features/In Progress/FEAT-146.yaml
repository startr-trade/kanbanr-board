definition:
  statement: A v0.1.1 release that ships the container image fixes, for anyone running kanbanr from GHCR, so that the published image is the released program without moving the v0.1.0 tag again
  goals:
  - G-6
  zachman:
    what: The version number, the changelog and the v0.1.1 release
    how: Bump the workspace, web and plugin versions, give the image fixes a 0.1.1 changelog section, run make ci, and verify the release run after the maintainer tags it
    where: api/Cargo.toml, api/Cargo.lock, web/package.json, .claude-plugin/plugin.json, CHANGELOG.md
    when: Now, before GA
    who: Anyone installing kanbanr or running its image
    why: The v0.1.0 image cannot say which build it is and lacks the skill; the fixes are on main but unreleased
