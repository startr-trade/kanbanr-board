definition:
  statement: Items that complete only when their requirements are proven, however they finish, for anyone relying on the board's Completed column, so that Completed means verified
  goals:
  - G-2
  - G-3
  zachman:
    what: Auto-advance into the end status on workflows without declared gates, and inside a batch
    how: Apply finish's evidence check to auto-advance on the legacy end status, and evaluate auto-advance for a batch after its last operation
    where: api/crates/kanbanr-core/src/store.rs, readiness.rs, config.rs, docs/src/using/processes.md
    when: Whenever an item's last task is completed, alone or in a batch
    who: Anyone reading the board's Completed column as done-and-verified
    why: FEAT-149 and FEAT-152 were completed by a batch with unproven requirements; finish would have refused
  requirements:
  - id: R-1
    kind: functional
    text: IF an item's last task completes while a requirement has no green test, THEN THE SYSTEM SHALL keep the item in its status and say which requirements are unproven.
    tests:
    - name: the last task does not complete an item with an unproven requirement
      kind: unit
      state: green
  - id: R-2
    kind: functional
    text: WHEN a batch completes an item's last task and then adds open tasks to it, THE SYSTEM SHALL leave the item in its status.
    tests:
    - name: a batch that adds open tasks after completing the last one does not advance the item
      kind: unit
      state: green
