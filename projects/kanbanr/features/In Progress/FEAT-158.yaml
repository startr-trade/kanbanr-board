definition:
  statement: Installers that can also install the matching VS Code extension, on request, for developers who want the board in their editor, so that the program and its extension are one install at one version
  goals:
  - G-5
  - G-6
  zachman:
    what: An opt-in editor-extension step in install.sh and install.ps1, and extension updates in self-update
    how: Find the release's .vsix, verify it against SHA256SUMS, install it with each editor's --install-extension; self-update does the same for editors that already have it
    where: scripts/install.sh, scripts/install.ps1, api/crates/kanbanr-cli/src/self_update.rs, .github/workflows/ci.yml, scripts/ci_local.py, docs/src/getting-started/installation.md
    when: When a user installs with the option, and on every self-update
    who: Developers using VS Code, VSCodium, Cursor or Windsurf
    why: VS Code cannot see Open VSX, so without this the extension is a separate manual download
  requirements:
  - id: R-1
    kind: functional
    text: WHEN the installer is run with the VS Code option, THE SYSTEM SHALL install the release's checksum-verified .vsix into each requested editor found on PATH.
    tests:
    - name: the installer's editor step installs the verified .vsix into each stub editor, and only the one named
      kind: manual
      state: green
  - id: R-2
    kind: functional
    text: IF the installer is run without the VS Code option, THEN THE SYSTEM SHALL install nothing into any editor.
    tests:
    - name: without the option the editor step installs nothing and prints the hint when an editor is present
      kind: manual
      state: green
  - id: R-3
    kind: functional
    text: WHEN kanbanr self-update replaces the program, THE SYSTEM SHALL update the extension in each editor that already has it installed.
    tests:
    - name: self-update installs the new .vsix into an editor that lists kanbanr.kanbanr, and not into one that does not
      kind: unit
      state: green
