definition:
  statement: The monitor UI as a static bundle published per release, for collaborators and reviewers, so that a board can be viewed from any static host without running kanbanr.
  goals:
  - G-5
  - G-0
  zachman:
    what: The built monitor UI and its API base-URL setting
    how: A runtime config.json (apiBase, routing, readOnly) read at startup; all URLs through apiUrl(); relative asset paths with <base href="/"> injected by the daemon; a release job packs kanbanr-monitor-<tag>.tar.gz, checked by scripts/check-monitor-bundle.sh
    where: web/, the release pipeline
    when: Each release
    who: collaborators and reviewers
    why: See what is built and why, without running anything
  requirements:
  - id: R-1
    kind: functional
    text: WHEN a release is published, THE SYSTEM SHALL attach the built monitor UI bundle as a release artifact.
    tests:
    - name: release::ui_bundle_attached
      kind: integration
      state: planned
  - id: R-2
    kind: functional
    text: WHERE an API base URL is configured, THE SYSTEM SHALL direct every UI request to that base URL.
    tests:
    - name: web::api_base_url_configurable
      kind: unit
      state: planned
  - id: R-3
    kind: functional
    text: WHERE the monitor runs from the standalone bundle with its shipped configuration, THE SYSTEM SHALL hide every decision action and show the matching CLI command instead.
    tests:
    - name: web::standalone_is_read_only
      kind: unit
      state: planned
