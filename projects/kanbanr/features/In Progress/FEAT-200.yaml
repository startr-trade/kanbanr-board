      kind: manual
      state: green
      checked_rev: 4f6048988d74cc96b4617230590b502f8b3b2cd6
  - id: R-15
    kind: functional
    text: WHEN a diagram in rendered markdown fails to parse, THE SYSTEM SHALL show its source and the error with its line under it.
    tests:
    - name: check:diagram-review
      kind: integration
