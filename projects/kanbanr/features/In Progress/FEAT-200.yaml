  - id: R-13
    kind: functional
    text: WHEN an item moves into a status whose gate requires `diagrams_valid`, THE SYSTEM SHALL lint its spec and each `affects_docs` doc at that moment and, IF any finding exists, refuse the move naming file, block, line and rule for each.
    tests:
    - name: readiness::tests::diagrams_valid_gate_blocks_and_names_findings
      kind: unit
      state: green
      checked_rev: 4f6048988d74cc96b4617230590b502f8b3b2cd6
  - id: R-14
    kind: functional
    text: WHEN the review page shows an item, THE SYSTEM SHALL parse every block of its spec and `affects_docs` with Pele, list each error with file, block, line and a link to the source, and keep Approve/Ratify disabled until all parse.
    tests:
    - name: check:diagram-review
      kind: integration
      state: green
      checked_rev: 4f6048988d74cc96b4617230590b502f8b3b2cd6
    - name: scripts/check-diagram-review.mjs
      kind: unit
