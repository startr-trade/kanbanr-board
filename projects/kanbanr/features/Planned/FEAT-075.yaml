definition:
  statement: A start gate that fires when work starts and not when an item is parked, for whoever is deferring something deliberately, so that the escape stays reserved for the case it was built for
  goals:
  - G-3
  - G-5
  zachman:
    what: Which statuses count as starting work
    how: The gate reads displayed_states, which already means the statuses where work in flight is tracked, instead of inferring activity by elimination
    where: kanbanr-core store, check_start_gate
    when: On every status move
    who: Whoever parks an item and is asked to agree to reasoning for work they are explicitly not doing
    why: Deferring FEAT-074 was refused for want of an approval, and the only ways past were to approve work nobody intended to start or to record an escape for a non-event
  requirements:
  - id: R-1
    kind: functional
    text: WHEN an item moves to a status that is displayed, is not the default and is not terminal, THE SYSTEM SHALL require a current approval.
    tests:
    - name: tests::the_start_gate_fires_on_starting_work_and_not_on_parking
      kind: unit
      state: planned
  - id: R-2
    kind: functional
    text: WHERE a status is not displayed on the board, THE SYSTEM SHALL let an item move there without an approval.
    tests:
    - name: tests::the_start_gate_fires_on_starting_work_and_not_on_parking
      kind: unit
      state: planned
  - id: R-3
    kind: functional
    text: THE SYSTEM SHALL keep the recorded escape available for beginning work without an agreed definition.
    tests:
    - name: tests::the_start_gate_fires_on_starting_work_and_not_on_parking
      kind: unit
      state: planned
