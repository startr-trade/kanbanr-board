definition:
  statement: An approval record that names the person who gave it, for anyone later asking who agreed to this, so that the agreement is evidence rather than a label
  goals:
  - G-2
  - G-3
  zachman:
    what: The `by` field on an approval, and whether approving or withdrawing is visible in the project's event stream
    how: The monitor reads the board's commit identity from /api/meta — the same source `kanbanr approve` defaults to — and dispatch refuses a verdict with no named approver; withdrawal collects its reason in the page; the two verdicts gain event kinds
    where: core/dispatch.rs, core/eventing.rs, server/lib.rs (/api/meta), web/src/api.ts, ReviewPage.tsx, FeaturePage.tsx
    when: Whenever a definition is approved or an approval is taken back
    who: Anyone auditing why work was allowed to start — and the reviewer, who was typing the withdrawal reason blind into a browser prompt
    why: The approval gate exists to obtain one accountable human decision. Recording the place the click happened instead of the person makes the record look like accountability while carrying none, and twenty-eight of this board's own approvals say 'reviewed in the monitor'
  requirements:
  - id: R-1
    kind: functional
    text: WHEN a verdict is recorded on a definition, THE SYSTEM SHALL require a named approver and SHALL refuse the verdict when none is given, rather than attributing it to nobody.
    tests:
    - name: tests::a_verdict_with_no_named_approver_is_refused
      kind: unit
      state: planned
  - id: R-2
    kind: functional
    text: WHEN an approval is given or withdrawn, THE SYSTEM SHALL emit an event for it, so that work whose mandate changed can be noticed without reading the item.
    tests:
    - name: eventing::tests::a_withdrawn_approval_is_an_event
      kind: unit
      state: planned
  - id: R-3
    kind: functional
    text: WHERE the monitor offers to record a verdict, THE SYSTEM SHALL attribute it to the board's commit identity, and WHERE no identity is configured SHALL withhold the action and say how to set one.
    tests:
    - name: the review page and feature page read api.approver(meta) and disable the action when it is null
      kind: manual
      state: planned
  - id: R-4
    kind: functional
    text: WHEN a withdrawal is being recorded, THE SYSTEM SHALL collect its reason within the page, showing what withdrawing does before it is confirmed.
    tests:
    - name: web/src/pages/FeaturePage.tsx uses an in-page textarea, not window.prompt
      kind: manual
      state: planned
defect:
  severity: medium
  introduced_by: FEAT-067
  found_in: the monitor, by the user asking what the withdraw button does
  root_cause: the UI's approve action was written as a self-describing literal rather than reading the identity the CLI already resolves; dispatch then defaulted a missing approver to "unknown", so no layer refused an unattributable verdict
  escaped: true
