code: FEAT-080
title: A recorded bypass is never reconciled once the work completes
status: Planned
milestone: MS-006
kind: null
priority: null
start: null
due: null
estimate_days: null
assignee: null
team: null
labels: []
depends_on: []
todo_lists: []
definition:
  statement: A decision on what reconciling a recorded bypass means, and whatever that decision implies, for anyone asking whether this board's gate was honoured, so that work built without prior agreement is not simply forgotten
  goals:
  - G-3
  - G-0
  zachman:
    what: What happens to `started_unapproved` after the work it excuses reaches a terminal status
    how: Undecided by design — the four options are set out in the spec, and the choice is an ADR because it turns on what an approval record is allowed to claim
    where: Undecided; probably core/doctor.rs and the approvals model, depending on the option chosen
    when: When work started under a recorded bypass reaches a terminal status
    who: Anyone auditing whether the gate was honoured — and the maintainer, who currently has no list to work from
    why: The bypass is honestly recorded and then listed by nothing once the item completes, so it is never reconciled. FEAT-072, FEAT-073 and FEAT-075 are in that position today; the record survives on each item, but finding them requires already knowing which to ask about
  requirements:
  - id: R-1
    kind: functional
    text: WHEN work that started under a recorded bypass reaches a terminal status, THE SYSTEM SHALL keep that bypass discoverable without the reader already knowing which item to ask about.
    tests:
    - name: a fixture item completed with started_unapproved set is reachable from a listing, not only from its own page
      kind: unit
      state: planned
  - id: R-2
    kind: functional
    text: THE SYSTEM SHALL distinguish, in the approval record, agreement given before work from agreement given after it, so that ratification cannot be read as prior agreement.
    tests:
    - name: a verdict recorded after the work is terminal is distinguishable from one recorded before it
      kind: unit
      state: planned
  - id: R-3
    kind: functional
    text: WHEN a reconciliation mechanism is added, THE SYSTEM SHALL already carry an accepted ADR recording which of the four options was chosen and what it costs.
    tests:
    - name: kanbanr adr list names an accepted decision whose affects includes FEAT-080
      kind: manual
      state: planned
  - id: R-4
    kind: nfr
    text: THE SYSTEM SHALL NOT weaken or remove the `--unapproved` escape, which is what keeps the gate honest under pressure.
    iso25010:
    - Maintainability
    scenario:
      stimulus: The reconciliation mechanism is added
      environment: Any board with items started under a recorded bypass
      response: Starting work with `--unapproved` still succeeds and still records its reason
      measure: tests::the_start_gate_refuses_unapproved_work_but_never_blocks_closing_it continues to pass unchanged
    tests:
    - name: tests::the_start_gate_refuses_unapproved_work_but_never_blocks_closing_it
      kind: unit
      state: green
