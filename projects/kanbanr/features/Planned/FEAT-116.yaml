definition:
  statement: Workflow presets as editable data with their gates, for anyone starting a project or bringing their own process, so that a process is chosen or loaded rather than coded
  goals:
  - G-5
  - G-3
  zachman:
    what: Named workflow templates
    how: Embedded YAML presets; CLI to apply, import and export; Mermaid notes
    where: api/crates/kanbanr-core/presets/, config.rs, dispatch.rs, mermaid.rs, kanbanr-cli config
    when: At project setup or when changing process
    who: Anyone choosing or defining a process
    why: Presets were code, and an unknown preset name silently fell back
  requirements:
  - id: R-1
    kind: functional
    text: WHEN a known preset is applied, THE SYSTEM SHALL set the project's workflow, including its gates, from that preset.
    tests:
    - name: presets_apply_with_their_gates
      kind: unit
      state: planned
  - id: R-2
    kind: functional
    text: IF an unknown preset name is given, THEN THE SYSTEM SHALL refuse it and list the known presets.
    tests:
    - name: an_unknown_preset_is_refused
      kind: unit
      state: planned
  - id: R-3
    kind: functional
    text: WHEN a workflow file is imported and exported, THE SYSTEM SHALL round-trip statuses, transitions and gates.
    tests:
    - name: workflow_files_round_trip
      kind: unit
      state: planned
