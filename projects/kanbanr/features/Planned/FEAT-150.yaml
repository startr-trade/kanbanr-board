definition:
  statement: A 1.0.0 release tagged only once its stability promise has evidence behind it, for everyone who will rely on kanbanr, so that 1.0 means the stable surface will hold
  goals:
  - G-5
  - G-6
  zachman:
    what: The 1.0.0 release and the conditions recorded before it
    how: Check each condition with evidence on this item, then bump the versions, date the changelog, run make ci and verify the tagged release
    where: api/Cargo.toml, web/package.json, .claude-plugin/plugin.json, CHANGELOG.md, the release workflow's run
    when: At least three weeks after v0.1.2, once the readiness items are done
    who: Every kanbanr user
    why: A 1.0 tagged before anyone else has used it promises stability nobody has tested
  requirements:
  - id: R-1
    kind: functional
    text: THE SYSTEM SHALL be tagged 1.0.0 only after three weeks of use since v0.1.2 with no breaking change to a stable surface and no unresolved defect.
    tests:
    - name: the conditions are recorded with evidence on this item before the tag
      kind: manual
      state: planned
  - id: R-2
    kind: functional
    text: WHEN v1.0.0 is tagged, THE SYSTEM SHALL publish binaries, installers and an image that report 1.0.0 and the tagged commit, verified on every platform.
    tests:
    - name: the v1.0.0 release run passes, including every verify-install leg
      kind: manual
      state: planned
