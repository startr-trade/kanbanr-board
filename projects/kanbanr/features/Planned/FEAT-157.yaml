definition:
  statement: A v0.1.4 release that ships the fix making Completed mean proven, for everyone running kanbanr, so that ticking an item's last task never completes it with requirements unproven
  goals:
  - G-2
  - G-6
  zachman:
    what: The version number, the release notes, the changelog and the v0.1.4 release
    how: Bump the versions, write the notes page and index entry, date the changelog section, run make ci, and verify the tagged release including its Open VSX publish
    where: api/Cargo.toml, api/Cargo.lock, web/package.json, web/package-lock.json, .claude-plugin/plugin.json, editor/vscode/package.json, editor/vscode/package-lock.json, docs/src/releases/, docs/src/SUMMARY.md, CHANGELOG.md
    when: Now, during the freeze
    who: Everyone running kanbanr, and its VS Code extension users
    why: The FEAT-156 fix only protects boards once it is in an installed release
  requirements:
  - id: R-1
    kind: functional
    text: WHEN v0.1.4 is tagged, THE SYSTEM SHALL publish binaries, installers, an image and a .vsix that report 0.1.4 and the tagged commit, verified on every installer platform.
    tests:
    - name: the v0.1.4 release run passes, including every verify-install leg and the image check
      kind: manual
      state: planned
  - id: R-2
    kind: functional
    text: WHEN v0.1.4 is published, THE SYSTEM SHALL show its notes on the release page and publish the extension to Open VSX at 0.1.4.
    tests:
    - name: the v0.1.4 release page opens with its notes and open-vsx.org lists kanbanr 0.1.4
      kind: manual
      state: planned
