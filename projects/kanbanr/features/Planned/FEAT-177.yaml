definition:
  statement: A documented, versioned read-only API contract for the monitor, for integrators and collaborators, so that tools built on the board keep working across releases.
  goals:
  - G-0
  - G-5
  zachman:
    what: Read-only HTTP routes and their schemas
    how: OpenAPI 3.1 v1 generated from schemars-derived core response types (untyped json! responses become named structs); served at /api/openapi.json, committed and rendered in the docs; a contract test validates every public route on a fixture board
    where: kanbanr-server
    when: Before 1.0, so the stability promise names a concrete contract
    who: integrators, collaborators and reviewers
    why: Stable integrations without reading source
  requirements:
  - id: R-1
    kind: functional
    text: THE SYSTEM SHALL serve the read-only routes exactly as the published, versioned OpenAPI description specifies.
    tests:
    - name: server::contract_matches_openapi
      kind: integration
      state: planned
