code: FEAT-182
title: 'Sign-offs: withdraw one given in error, and offer only the immediate next stage''s sign-offs'
status: Planned
milestone: MS-007
kind: feature
priority: high
start: null
due: null
estimate_days: null
assignee: null
team: null
labels:
- approval
- signoff
- monitor
depends_on: []
todo_lists: []
definition:
  statement: Withdrawable sign-offs, offered only for the next stage, for the solo developer and reviewers, so that a person's agreement is given at the right moment and can be corrected when it was not.
  goals:
  - G-3
  zachman:
    what: Sign-off withdrawal; next-stage-only sign-off offers
    how: ''
    where: kanbanr-core readiness, dispatch review, CLI signoff, monitor review page
    when: When a sign-off is given in error; when the review queue is built
    who: the solo developer, collaborators and reviewers
    why: A mistaken or premature sign-off otherwise stands forever and misstates agreement
  requirements:
  - id: R-1
    kind: functional
    text: WHEN `kanbanr signoff <CODE> <NAME> --withdraw --reason <why>` runs, THE SYSTEM SHALL record the withdrawal and stop counting that sign-off, keeping the earlier one as history.
    tests:
    - name: signoff_withdraw_stops_counting
      kind: unit
      state: planned
  - id: R-2
    kind: functional
    text: IF a withdrawal has no reason, THE SYSTEM SHALL refuse it.
    tests:
    - name: signoff_withdraw_requires_reason
      kind: unit
      state: planned
  - id: R-3
    kind: functional
    text: WHEN the review queue is built, THE SYSTEM SHALL offer sign-offs only for the immediate next stage in workflow order.
    tests:
    - name: review_offers_only_next_stage_signoffs
      kind: unit
      state: planned
