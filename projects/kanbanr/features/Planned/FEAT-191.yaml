definition:
  statement: A drift check between the board and the repository's branches, for the solo developer and reviewers, so that disagreements are found and named instead of discovered at release time.
  goals:
  - G-4
  zachman:
    what: Branch versus state report
    how: ''
    where: kanbanr-core git, doctor
    when: On demand and in doctor
    who: the solo developer, collaborators and reviewers
    why: Board and branches otherwise drift silently
  requirements:
  - id: R-1
    kind: functional
    text: THE SYSTEM SHALL report items in the integrate role whose branch is not merged into the line of integration.
    tests:
    - name: git_doctor_unmerged_integrated_items
      kind: integration
      state: planned
  - id: R-2
    kind: functional
    text: THE SYSTEM SHALL report commits on a line of integration whose item is not at the integrate role or later.
    tests:
    - name: git_doctor_unfinished_commits_on_line
      kind: integration
      state: planned
  - id: R-3
    kind: functional
    text: THE SYSTEM SHALL report branches that name no item, and release fixes not merged forward.
    tests:
    - name: git_doctor_orphans_and_forward_merges
      kind: integration
      state: planned
