definition:
  statement: kanbanr's TLS client trusts no certificate path through the distrusted emSign intermediates, so its update and release checks cannot be served by a forged certificate
  goals:
  - G-0
  - G-6
  zachman:
    what: The trust store and certificate verifier ureq uses (webpki-roots, rustls-webpki)
    how: Patch-level lockfile update to the fixed releases; no code change
    where: api/Cargo.lock
    when: 'Now: CI fails on every branch since the advisories were published'
    who: Anyone running kanbanr's self-update or release check
    why: RUSTSEC-2026-0381 and RUSTSEC-2026-0382, published 19-20 Oct 2026
  requirements:
  - id: R-1
    kind: functional
    text: THE SYSTEM SHALL depend on no crate version with a known RustSec vulnerability
    tests:
    - name: 'ci.yml supply-chain: cargo deny and cargo audit'
      kind: integration
      state: planned
  - id: R-2
    kind: functional
    text: THE SYSTEM SHALL continue to pass its whole test suite, the self-update and release-check tests included
    tests:
    - name: cargo test --workspace
      kind: integration
      state: planned
