definition:
  statement: The monitor's Workflow page shows in one place how work moves from an item branch to a tagged release, and every guard rail that will refuse a step on the way
  goals:
  - G-1
  - G-5
  - G-3
  zachman:
    what: The cadence, the git model and the project's guard rails, on the Workflow page
    how: A read route assembling the guard rails from what exists; the daemon passing its repository to the git routes; three page sections
    where: web/src/pages/WorkflowPage.tsx, kanbanr-core dispatch, kanbanr-server read passthrough
    when: Whenever the Workflow page is opened; live with the board
    who: The developer, and Claude after a break, reading how the project works
    why: "Asked 21 Oct 2026: the setup is spread over a dozen CLI commands and nowhere visible together"
  requirements:
  - id: R-1
    kind: functional
    text: THE SYSTEM SHALL report, in one read, the method's parts, the commit rules, diagram strictness, coverage rules and the board's push policy
    tests:
    - name: guards_route_reports_every_guard_rail
      kind: unit
      state: planned
  - id: R-2
    kind: functional
    text: WHEN the monitor asks for the git model or git doctor, THE SYSTEM SHALL answer from the code repository the daemon was started in
    tests:
    - name: daemon_serves_git_model_with_its_repository
      kind: integration
      state: planned
  - id: R-3
    kind: functional
    text: THE SYSTEM SHALL show on the Workflow page the cadence, the git model and the guard rails, each with the command that changes it, read-only
    tests:
    - name: web::workflow_shows_cadence_git_model_and_guards
      kind: unit
      state: planned
    - name: "manual: the Workflow page on kanbanr's board shows its sprint, releases, git model and guard rails, in light and dark"
      kind: manual
      state: planned
