definition:
  statement: In every project using kanbanr, Claude briefs each sub-agent with precise boundaries for its role, build agents record their own progress, and the board never lags the code
  goals:
  - G-1
  - G-3
  - G-5
  zachman:
    what: "The skill's rules for sub-agents: a boundary table per role and the coordinator's duties"
    how: A subsection in the skill's method section, mirrored in the book, with a guard test
    where: skill/kanbanr/SKILL.md, docs/src/using/the-method.md, api/crates/kanbanr-cli/src/skill.rs
    when: Whenever Claude starts a sub-agent in a kanbanr-tracked project
    who: Claude as coordinator, the sub-agents it starts, and the user reviewing the board
    why: On 21 Oct 2026 sub-agent limits lived only in prose briefs; one forbade all board writes, and an item's tasks lagged six commits behind its code
  requirements:
  - id: R-1
    kind: functional
    text: THE SYSTEM SHALL state in the skill, for each sub-agent role, what it may and may not do, and the coordinator's duty to brief it and keep the board current
    tests:
    - name: skill_states_sub_agent_boundaries
      kind: unit
      state: planned
    - name: "manual: the skill's and the book's sub-agent subsections agree"
      kind: manual
      state: planned
