code: FEAT-217
title: An item's code says what kind of work it is
status: Planned
milestone: MS-004
kind: feature
priority: High
start: null
due: null
estimate_days: null
sprint: SP-001
release: v0.4.0
assignee: null
team: null
labels: []
depends_on: []
todo_lists: []
definition:
  statement: An item's code names the kind of work it is (FTR, DEF, MNT, DOC, SPK, set per project) so a defect, a chore or a docs change is told from a feature at a glance, with a counter per prefix; existing FEAT- codes are kept and a later kind change never renames
  goals:
  - G-5
  - G-4
  - G-0
  zachman:
    what: A codes map from kind to prefix in the project config, and a counter per prefix
    how: Allocation picks the prefix from the kind at creation; the reference finder recognises the board's prefixes (configured plus in use), never a general shape
    where: kanbanr-core config, store, dispatch, refs and scm; the CLI config codes; the monitor's boardRefs.ts and its shared fixture
    when: At item creation, and whenever markdown, branches or trailers are read
    who: The developer reading the board, and Claude creating items with --kind
    why: On 22 Oct 2026 the user said the FEAT prefix confuses them about the type
  requirements:
  - id: R-1
    kind: functional
    text: WHEN an item is created without an explicit code and the project's codes give its kind a prefix, THE SYSTEM SHALL code it <PREFIX>-<n>, where n is one more than the highest number among the project's items with that prefix, zero-padded to 3
    tests:
    - name: tests::codes_follow_the_kind_with_a_counter_per_prefix
      kind: unit
      state: planned
  - id: R-2
    kind: functional
    text: WHERE a project sets no codes, THE SYSTEM SHALL code every new item FEAT-<n> as before
    tests:
    - name: tests::an_unconfigured_project_keeps_feat_codes
      kind: unit
      state: planned
    - name: tests::code_generation_is_sequential
      kind: unit
      state: planned
  - id: R-3
    kind: functional
    text: WHEN an item has no kind, THE SYSTEM SHALL use the feature entry; WHEN its kind has no entry, THE SYSTEM SHALL use the default prefix, or FEAT when that is absent
    tests:
    - name: config::tests::prefix_for_falls_back_to_feature_then_default
      kind: unit
      state: planned
  - id: R-4
    kind: functional
    text: WHEN an item's kind changes, THE SYSTEM SHALL keep its code
    tests:
    - name: tests::a_kind_change_never_renames
      kind: unit
      state: planned
  - id: R-5
    kind: functional
    text: WHEN config codes would set a prefix that is not 2-6 uppercase letters, is reserved (MS, ADR, SC, SP, TL), or is used by a milestone, or a blank or duplicate kind, THE SYSTEM SHALL refuse it naming the entry and leave the config unchanged
    tests:
    - name: config::tests::codes_problems_name_the_entry
      kind: unit
      state: planned
    - name: tests::set_codes_refuses_and_changes_nothing
      kind: unit
      state: planned
  - id: R-6
    kind: functional
    text: WHEN a batch creates several items, THE SYSTEM SHALL number each by its own prefix in bundle order, and ref aliases SHALL resolve to the assigned codes
    tests:
    - name: tests::batch_numbers_each_kind_in_bundle_order
      kind: unit
      state: planned
  - id: R-7
    kind: functional
    text: THE SYSTEM SHALL treat a prose token as an item reference only when its prefix is configured or used by an existing item, so SHA-256, RFC-3339, ISO-9001 and UTF-8 are not references; the monitor SHALL agree
    tests:
    - name: refs::tests::finder_matches_the_shared_fixture
      kind: unit
      state: planned
    - name: check:markdown
      kind: integration
      state: planned
  - id: R-8
    kind: functional
    text: "WHEN start runs on a kind-coded defect, THE SYSTEM SHALL branch fix/DEF-001-<slug>, commit SHALL fill Refs: kanbanr:DEF-001, and the hooks, git doctor and why SHALL resolve it"
    tests:
    - name: flow::tests::a_kind_coded_defect_starts_on_its_fix_branch
      kind: unit
      state: planned
    - name: scm::tests::kind_prefixed_codes_round_trip_branch_and_trailer
      kind: unit
      state: planned
    - name: kind_coded_item_start_commit_why
      kind: integration
      state: planned
  - id: R-9
    kind: functional
    text: WHILE codes is unset, THE SYSTEM SHALL load, reference and allocate around existing kind-coded items
    tests:
    - name: tests::an_unconfigured_reader_handles_kind_coded_items
      kind: unit
      state: planned
  - id: R-10
    kind: functional
    text: WHEN another config write happens, THE SYSTEM SHALL keep codes unchanged
    tests:
    - name: tests::other_config_writes_keep_codes
      kind: unit
      state: planned
  - id: R-11
    kind: functional
    text: WHEN the config's codes are invalid, THE SYSTEM SHALL refuse code allocation naming the problem, and doctor SHALL report it as an error
    tests:
    - name: doctor::tests::doctor_reports_invalid_codes
      kind: unit
      state: planned
  - id: R-12
    kind: functional
    text: WHEN kanbanr config codes runs, THE SYSTEM SHALL show each kind's prefix, the default and the next code per prefix; --set, --unset, --default and --clear SHALL change them
    tests:
    - name: config_codes_sets_shows_and_clears
      kind: integration
      state: planned
