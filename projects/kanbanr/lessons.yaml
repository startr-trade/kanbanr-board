  lesson: A guardrail must be observed failing before it counts — twice in one session a check I wrote passed against the exact bug it was written for. check:ui's first affordance rule compared class names while .btn and .chip shared a background; its first duplicate-link rule used <Link[^>]*> which stops at the > inside className={({isActive}) => ...}, so it matched nothing at all and reported success. Both were caught only by deliberately reintroducing the defect. ADR-0008 makes the revert part of writing the check.
