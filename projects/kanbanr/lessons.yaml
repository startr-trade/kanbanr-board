  lesson: Fix every instance of a bug, not the one that bit you. FEAT-082's first fix scoped inline_message to the git commit invocation and left the hook-skipping check two lines above it still scanning the whole command line — so a message explaining '[ -n $x ]' was read as passing -n, and the commit was refused. The second failure looked like a new bug and was the same one. When a defect is 'a token matched without its boundary', grep for every other match of that shape in the same function before calling it done.
