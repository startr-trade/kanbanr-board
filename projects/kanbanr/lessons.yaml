- id: L-23
  lesson: 'Recognise a token with its boundary, never as a substring. Three defects on this board are the same mistake: [no-ref] matched in prose so a commit explaining the escape was read as taking it (FEAT-056); a test name''s / was passed into a route by a whole-path encoder used on one segment (FEAT-079); and the commit guard found ''-m'' anywhere in a command line, refusing correct commits and blocking a Python script that merely mentioned the flag (FEAT-082). Writing the rule down after the first one did not stop the next two — so when parsing anything out of free text, state what the boundary is before writing the match.'
  kind: pitfall
